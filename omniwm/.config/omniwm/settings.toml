[gaps.outer]
bottom = 0.0
left = 0.0
right = 0.0
top = 0.0

[general]
animationsEnabled = true
defaultLayoutType = "niri"
hotkeysEnabled = true
hyperKeyHoldThresholdMilliseconds = 150
hyperTrigger = "Left Option"
ipcEnabled = false
preventSleepEnabled = false
updateChecksEnabled = true

[gestures]
