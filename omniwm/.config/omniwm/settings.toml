monitorBarOverrides = []
monitorDwindleOverrides = []
monitorNiriOverrides = []
monitorOrientationOverrides = []

[appearance]
mode = "dark"

[borders]
enabled = false
width = 2.5

[borders.color]
alpha = 1.0
blue = 0.9826379418373108
green = 0.9642251133918762
red = 0.26653504371643066

[clipboard]
