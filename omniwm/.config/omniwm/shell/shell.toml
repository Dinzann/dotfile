profile = "celestial"

[profiles]

[profiles.celestial]
center = ["active-window"]
leading = ["apple-menu", "app-menu", "omniwm", "workspaces", "scratchpads"]
scheme = "tonalSpot"
theme = "wallpaper"
trailing = ["media", "notifications", "volume", "status", "control-center", "system-stats", "clock", "power"]

[profiles.celestial.island]
fullscreen = "hide"

[profiles.celestial.widgets]

[profiles.celestial.widgets.clock]
date = true
icon = false

[profiles.celestial.workspaceBar]
fullWidth = true
fullWidthNotchMode = "rightOfNotch"
height = 40.0
hideEmptyWorkspaces = false
notificationBadges = "dot"
position = "left"
reserveLayoutSpace = true
showFloatingWindows = true
solidBlackBackground = false
transparentBackground = false
windowLevel = "status"
